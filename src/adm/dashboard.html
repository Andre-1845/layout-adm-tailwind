<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <base href="/src/">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="output.css" rel="stylesheet" />

    <title>Tailwind</title>
  </head>
  <body class="bg-dashboard">
    <!-- Navbar -->
    <nav class="navbar">
      <div class="navbar-container">
        <button id="toggleSidebar" class="menu-button">
          <svg
            class="h-6 w-6"
            stroke="currentColor"
            fill="none"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </button>
        <div class="user-container">
          <div class="relative">
            <!-- Dropdown -->
            <button id="userDropdownButton" class="dropdown-button">
              Usuário
              <svg
                class="dropdown-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 20 20"
                fill="currentColor"
              >
                <path
                  fill-rule="evenodd"
                  d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 011.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                  clip-rule="evenodd"
                />
              </svg>
            </button>
            <!-- Conteúdo do Dropdown -->
            <div id="dropdownContent" class="dropdown-content hidden">
              <a href="#" class="dropdown-item">Perfil</a>
              <a href="#" class="dropdown-item">Sair</a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <div class="flex">
      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-container">
          <button id="closeSidebar" class="sidebar-close-button">
            <svg
              class="h-6 w-6"
              stroke="currentColor"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
          <div class="sidebar-header">
            <span class="sidebar-title">Celke</span>
          </div>
          <nav class="sidebar-nav">
            <!-- DASHBOARD Link -->
            <a href="adm/dashboard.html" class="sidebar-link">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
  <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
</svg>

              <span>Dashboard</span>
            </a>
            <!-- USUARIOS Link -->
            <a href="adm/user/list.html" class="sidebar-link">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
</svg>

              <span>Usuários</span>
            </a>
            <!-- SAIR Link -->
            <a href="index.html" class="sidebar-link">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
  <path stroke-linecap="round" stroke-linejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
</svg>

              <span>Sair</span>
            </a>
          </nav>
        </div>
      </aside>

            <!-- Conteudo Principal -->
      <main class="main-content">
        <!-- Titulo e trilha de navegacao -->
        <div class="content-wrapper">
          <div class="content-header">
            <h2 class="content-title">Dashboard</h2>
            <nav class="breadcrumb">
              <span>Dashboard</span>
            </nav>
          </div>
        </div>

        <div class="content-box">
          <div class="content-box-header">
            <h3 class="content-box-title">Página Inicial</h3>
              <div class="content-box-btn"></div>
          </div>

          <div class="content-box-body">
            Bem-vindo ...!
          </div>
        </div>
</main>

      <!-- Fim Conteudo Principal -->


    <!-- Script para abrir/fechar o dropdown -->
    <script>
      const dropdownButton = document.getElementById("userDropdownButton");
      const dropdownContent = document.getElementById("dropdownContent");

      dropdownButton.addEventListener("click", function () {
        const isOpen = dropdownContent.classList.contains("hidden");
        if (isOpen) {
          dropdownContent.classList.remove("hidden");
        } else {
          dropdownContent.classList.add("hidden");
        }
      });

      // Fechar o dropdown se clicar fora dele
      window.addEventListener("click", function (event) {
        if (
          !dropdownButton.contains(event.target) &&
          !dropdownContent.contains(event.target)
        ) {
          dropdownContent.classList.add("hidden");
        }
      });
    </script>

    <!-- Apresentar e ocultar sidebar -->
    <script>
      document
        .getElementById("toggleSidebar")
        .addEventListener("click", function () {
          document.getElementById("sidebar").classList.toggle("sidebar-open");
        });

      document
        .getElementById("closeSidebar")
        .addEventListener("click", function () {
          document.getElementById("sidebar").classList.remove("sidebar-open");
        });
    </script>
  </body>
</html>
