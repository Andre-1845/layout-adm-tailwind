<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <base href="/src/">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="output.css" rel="stylesheet" />

    <title>Tailwind</title>
  </head>
  <body class="bg-dashboard">
    <!-- Navbar -->
    <nav class="navbar">
      <div class="navbar-container">
        <button id="toggleSidebar" class="menu-button">
          <svg
            class="h-6 w-6"
            stroke="currentColor"
            fill="none"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </button>
        <div class="user-container">
          <div class="relative">
            <!-- Dropdown -->
            <button id="userDropdownButton" class="dropdown-button">
              Usuário
              <svg
                class="dropdown-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 20 20"
                fill="currentColor"
              >
                <path
                  fill-rule="evenodd"
                  d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 011.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                  clip-rule="evenodd"
                />
              </svg>
            </button>
            <!-- Conteúdo do Dropdown -->
            <div id="dropdownContent" class="dropdown-content hidden">
              <a href="#" class="dropdown-item">Perfil</a>
              <a href="#" class="dropdown-item">Sair</a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <div class="flex">
      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-container">
          <button id="closeSidebar" class="sidebar-close-button">
            <svg
              class="h-6 w-6"
              stroke="currentColor"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
          <div class="sidebar-header">
            <span class="sidebar-title">Celke</span>
          </div>
          <nav class="sidebar-nav">
            <a href="adm/dashboard.html" class="sidebar-link">Dashboard</a>
            <a href="adm/user/list.html" class="sidebar-link">Usuários</a>
            <a href="index.html" class="sidebar-link">Sair</a>
          </nav>
        </div>
      </aside>

            <!-- Conteudo Principal -->
      <main class="main-content">
        <!-- Titulo e trilha de navegacao -->
        <div class="content-wrapper">
          <div class="content-header">
            <h2 class="content-title">Usuários - Editar</h2>
            <nav class="breadcrumb">
              <a href="adm/dashboard.html" class="breadcrumb-link">Dashboard</a>
              <span>/</span>
              <a href="adm/user/list.html" class="breadcrumb-link">Usuários</a>
               <span>/</span>
              <span>Editar</span>
            </nav>
          </div>
        </div>

        <div class="content-box">
          <div class="content-box-header">
            <h3 class="content-box-title">Editar</h3>
              <div class="content-box-btn">
                 <a href="adm/user/list.html" class="btn-info flex items-center space-x-1">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
  <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
</svg>

                  <span>Listar</span>
                </a>
              </div>
          </div>

          <div class="content-box-body">
            Bem-vindo ...!
          </div>
        </div>
</main>

      <!-- Fim Conteudo Principal -->


    <!-- Script para abrir/fechar o dropdown -->
    <script>
      const dropdownButton = document.getElementById("userDropdownButton");
      const dropdownContent = document.getElementById("dropdownContent");

      dropdownButton.addEventListener("click", function () {
        const isOpen = dropdownContent.classList.contains("hidden");
        if (isOpen) {
          dropdownContent.classList.remove("hidden");
        } else {
          dropdownContent.classList.add("hidden");
        }
      });

      // Fechar o dropdown se clicar fora dele
      window.addEventListener("click", function (event) {
        if (
          !dropdownButton.contains(event.target) &&
          !dropdownContent.contains(event.target)
        ) {
          dropdownContent.classList.add("hidden");
        }
      });
    </script>

    <!-- Apresentar e ocultar sidebar -->
    <script>
      document
        .getElementById("toggleSidebar")
        .addEventListener("click", function () {
          document.getElementById("sidebar").classList.toggle("sidebar-open");
        });

      document
        .getElementById("closeSidebar")
        .addEventListener("click", function () {
          document.getElementById("sidebar").classList.remove("sidebar-open");
        });
    </script>
  </body>
</html>
