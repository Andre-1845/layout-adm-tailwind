<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../output.css" rel="stylesheet" />

    <title>Tailwind</title>
  </head>
  <body class="bg-login">
    <div class="card-login">
      <div class="logo-wrapper-login">
        <a href="/">
          <img
            class="w-32 mx-auto"
            src="../../public/Brasao armas nac.gif"
            alt="Imagem LOGO"
          />
        </a>
      </div>

      <h1 class="title-login">Novo Usuário</h1>

      <form action="#" method="POST" class="mt-4">
        <!-- Campo nome -->
        <div class="mt-4">
          <label for="name" class="form-label-login">Nome</label>
          <input
            type="text"
            name="name"
            id="name"
            placeholder="Nome completo"
            class="form-input-login"
          />
        </div>

        <!-- Campo e-mail -->
        <div class="mt-4">
          <label for="email" class="block text-sm font-medium text-gray-700"
            >E-mail</label
          >
          <input
            type="email"
            name="email"
            id="email"
            placeholder="Melhor e-mail"
            class="form-input-login"
          />
        </div>

        <!-- Campo senha -->
        <div class="mt-4">
          <label for="password" class="block text-sm font-medium text-gray-700"
            >Senha</label
          >
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Digite a senha"
            class="form-input-login"
          />
        </div>

        <!-- Link para página de login e botão cadastrar novo usuário -->
        <div class="btn-group-login">
          <a href="../index.html" class="link-login">Login</a>
          <button type="submit" class="btn-primary">Cadastrar</button>
        </div>
      </form>
    </div>
  </body>
</html>
