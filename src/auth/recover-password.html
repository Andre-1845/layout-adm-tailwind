<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../output.css" rel="stylesheet" />

    <title>Tailwind</title>
  </head>
  <body class="bg-login">
    <div class="card-login">
      <div class="logo-wrapper-login">
        <a href="/">
          <img
            class="w-32 mx-auto"
            src="../../public/Brasao armas nac.gif"
            alt="Imagem LOGO"
          />
        </a>
      </div>

      <h1 class="title-login">Recuperar Senha</h1>

      <form action="#" method="POST" class="form-group-login">
        <!-- Campo e-mail -->
        <div class="form-group-login">
          <label for="email" class="form-label-login">E-mail</label>
          <input
            type="email"
            name="email"
            id="email"
            placeholder="Digite o e-mail cadastrado"
            class="form-input-login"
          />
        </div>

        <!-- Link para página de login e botão recuperar senha -->
        <div class="btn-group-login">
          <a href="../index.html" class="link-login">Login</a>
          <button type="submit" class="btn-primary">Recuperar</button>
        </div>

        <div class="mt-4 text-center">
          <a href="./new-user.html" class="link-login">Criar nova conta!</a>
        </div>
      </form>
    </div>
  </body>
</html>
